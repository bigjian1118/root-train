<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>心理测评选择 · 心晴</title>
  <link rel="stylesheet" href="/static/css/common.css">
  <link rel="stylesheet" href="/static/css/test_select.css">
</head>
<body>
  <div class="page">
    <section class="pick-panel">
      <div class="head-nav">
        <a class="back" href="/" onclick="if(history.length&gt;1){history.back();return false;}return true;">← 返回上一页</a>

      <div class="scale-list">

          <div class="scale-body">

            <div class="scale-meta">
              <span class="chip chip-green">适用人群：高中生及大学生</span>
              <span class="chip chip-gold">共 90 题</span>
            </div>
            <p>适用于高中生及大学生，共90题，深度心理健康筛查。</p>
          </div>
          <span class="scale-btn">点击进入 →</span>

  </div>
  <script src="/static/js/auth.js"></script>
