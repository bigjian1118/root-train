<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>心理活动素材库 · 心晴</title>
  <link rel="stylesheet" href="/static/css/common.css">
  <link rel="stylesheet" href="/static/css/teacher_materials.css">
</head>
<body>
  <div class="page">
    <!-- 顶部导航 -->
    <div class="head-nav">
      <a class="back" href="/" onclick="if(history.length&gt;1){history.back();return false;}return true;">← 返回上一页</a>
      <a class="back-link" href="/profile">返回个人中心</a>
    </div>

    <h1>📚 心理活动素材库</h1>
    <p class="sub">班会方案 / 团体活动方案 / 心理科普PPT，全部教师可查看与下载，仅作为心理健康教育工作参考。</p>

    <!-- 工具栏：搜索 + 分类筛选 + 上传 -->
    <div class="toolbar">
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="🔍 搜索素材标题…" autocomplete="off">
        <button type="button" id="searchClear" title="清空" hidden>✕</button>
      </div>
      <select id="categoryFilter">
        <option value="">全部分类</option>
        <option value="班会方案">班会方案</option>
        <option value="团体活动方案">团体活动方案</option>
        <option value="心理科普PPT">心理科普PPT</option>
        <option value="其他">其他</option>
      </select>
      <button type="button" class="btn btn-primary" id="uploadBtn">⬆ 上传素材</button>
    </div>

    <!-- 素材卡片列表 -->
    <div class="mat-grid" id="matGrid">
      <div class="loading">加载中…</div>
    </div>

    <!-- 空状态 -->
    <div class="empty-tip" id="emptyTip" hidden>暂无匹配的素材，点击右上角「上传素材」分享你的第一份方案吧。</div>

    <!-- 分页 -->
    <div class="pager" id="pager" hidden>
      <button class="page-btn" id="prevPage">← 上一页</button>
      <span class="page-info" id="pageInfo"></span>
      <button class="page-btn" id="nextPage">下一页 →</button>
    </div>
  </div>

  <!-- 上传素材弹窗 -->
  <div class="modal-mask" id="uploadModal" hidden>
    <div class="modal-panel">
      <div class="modal-head">
        <h3>⬆ 上传素材</h3>
        <button type="button" class="modal-close" id="uploadClose">✕</button>
      </div>
      <form id="uploadForm">
        <label class="field">
          <span class="field-label">素材标题 <em>*</em></span>
          <input type="text" id="matTitle" maxlength="60" placeholder="如：开学季情绪调适主题班会" required>
        </label>
        <label class="field">
          <span class="field-label">素材分类 <em>*</em></span>
          <select id="matCategory" required>
            <option value="班会方案">班会方案</option>
            <option value="团体活动方案">团体活动方案</option>
            <option value="心理科普PPT">心理科普PPT</option>
            <option value="其他">其他</option>
          </select>
        </label>
        <label class="field">
          <span class="field-label">素材简介（选填）</span>
          <textarea id="matBrief" rows="3" maxlength="300" placeholder="简要说明素材的适用场景与使用方法…"></textarea>
        </label>
        <label class="field">
          <span class="field-label">选择文件 <em>*</em></span>
          <div class="file-pick" id="filePick">
            <input type="file" id="matFile" accept=".pdf,.docx,.pptx" hidden>
            <span id="filePickText">📎 点击选择本地文件（支持 pdf / docx / pptx，不限大小）</span>
          </div>
        </label>
        <div class="modal-foot">
          <button type="button" class="btn btn-ghost" id="uploadCancel">取消</button>
          <button type="submit" class="btn btn-primary" id="uploadSubmit">提交上传</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 素材详情弹窗 -->
  <div class="modal-mask" id="detailModal" hidden>
    <div class="modal-panel">
      <div class="modal-head">
        <h3>📄 素材详情</h3>
        <button type="button" class="modal-close" id="detailClose">✕</button>
      </div>
      <div class="detail-body" id="detailBody">加载中…</div>
      <div class="modal-foot">
        <button type="button" class="btn btn-ghost" id="detailCloseBtn">关闭</button>
        <a class="btn btn-primary" id="detailDownload" href="#">⬇ 下载文件</a>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" hidden></div>
  <script src="/static/js/auth.js"></script>
  <script src="/static/js/teacher_materials.js"></script>
</body>
</html>
