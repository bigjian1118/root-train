<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>心理咨询预约管理 · 心晴</title>
  <link rel="stylesheet" href="/static/css/common.css">
  <link rel="stylesheet" href="/static/css/appointment_manage.css">
</head>
<body>
  <div class="page">
    <div class="head-nav">
      <a class="back" href="/" onclick="if(history.length&gt;1){history.back();return false;}return true;">← 返回上一页</a>
      <a class="back-link" href="/">返回首页</a>
    </div>
    <h1>🗓️ 心理咨询预约管理</h1>
    <p class="sub">作为咨询师，先排出可预约时段，再处理学生提交的预约（同意/拒绝）。</p>

    <!-- 排班表单 -->
    <h2 class="sec-title">排出可约时段</h2>
    <div class="form-row">
      <input type="date" id="slotDate">
      <input type="time" id="slotStart"> 至 <input type="time" id="slotEnd">
      <input type="number" id="slotCapacity" placeholder="最大人数（默认1）" min="1" step="1">
      <input type="text" id="slotNote" placeholder="备注（选填，如地点/主题）" maxlength="60">
      <button class="btn-add" id="slotAdd">➕ 添加时段</button>
    </div>
    <p class="form-msg" id="slotMsg" hidden></p>

    <!-- 我的时段 -->
    <h2 class="sec-title">我的可约时段</h2>
    <div id="slotList"><p class="empty-tip">你还没有排可约时段。</p></div>

    <!-- 收到的预约申请：审批处理 / 历史台账 两个页签 -->
    <h2 class="sec-title">收到的预约申请</h2>
    <div class="tab-bar">
      <button class="tab-btn active" data-tab="approve">审批处理</button>
      <button class="tab-btn" data-tab="ledger">历史台账</button>
    </div>

    <!-- 审批处理视图 -->
    <div id="approvePane">
      <!-- 新预约红色角标横幅：有待审核时醒目提示，无则隐藏 -->
      <div class="new-alert" id="newAlert" hidden>
        <span class="new-dot">●</span> 您有 <b id="newCount">0</b> 条新的待审核预约，请及时处理
      </div>
      <div class="filter-row">
        <label for="statusFilter">按状态筛选：</label>
        <select id="statusFilter">
          <option value="all">全部</option>
          <option value="pending">⏳ 待审核</option>
          <option value="confirmed">✅ 已通过</option>
          <option value="rejected">❌ 已驳回</option>
          <option value="cancelled">🚫 学生取消</option>
          <option value="done">🎉 已完成</option>
        </select>
      </div>
      <div id="apptList"><p class="empty-tip">还没有预约申请。</p></div>
    </div>

    <!-- 历史台账视图 -->
    <div id="ledgerPane" hidden>
      <div id="ledgerList"><p class="empty-tip">暂无历史预约记录。</p></div>
    </div>
  </div>

  <!-- 驳回预约弹窗：驳回原因必填 -->
  <div class="modal-mask" id="rejectMask" hidden>
    <div class="modal">
      <h3>驳回预约</h3>
      <p class="modal-tip">请填写驳回原因，学生将在预约详情中看到该原因。</p>
      <label>驳回原因（必填）</label>
      <textarea id="rjText" rows="3" maxlength="200" placeholder="如：该时段安排有调整，请改约其他时段"></textarea>
      <div class="modal-ops">
        <button class="btn-cancel" id="rjCancel">取消</button>
        <button class="btn-danger" id="rjSave">确认驳回</button>
      </div>
      <p class="modal-msg" id="rjMsg" hidden></p>
    </div>
  </div>

  <!-- 编辑时段弹窗 -->
  <div class="modal-mask" id="editMask" hidden>
    <div class="modal">
      <h3>编辑可约时段</h3>
      <label>预约日期</label>
      <input type="date" id="edtDate">
      <label>开始时间 至 结束时间</label>
      <div class="modal-time">
        <input type="time" id="edtStart"> 至 <input type="time" id="edtEnd">
      </div>
      <label>最大预约人数</label>
      <input type="number" id="edtCapacity" min="1" step="1">
      <label>备注（选填，如地点/主题）</label>
      <input type="text" id="edtNote" maxlength="60">
      <div class="modal-ops">
        <button class="btn-cancel" id="edtCancel">取消</button>
        <button class="btn-ok" id="edtSave">保存</button>
      </div>
      <p class="modal-msg" id="edtMsg" hidden></p>
    </div>
  </div>

  <script src="/static/js/auth.js"></script>
  <script src="/static/js/appointment_manage.js"></script>
</body>
</html>
