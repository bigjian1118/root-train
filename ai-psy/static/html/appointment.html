<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>心理咨询预约 · 心晴</title>
  <link rel="stylesheet" href="/static/css/common.css">
  <link rel="stylesheet" href="/static/css/appointment.css">
</head>
<body>
  <div class="page">
    <div class="head-nav">
      <a class="back" href="/" onclick="if(history.length&gt;1){history.back();return false;}return true;">← 返回上一页</a>
      <a class="back-link" href="/">返回首页</a>
    </div>
    <h1>🗓️ 心理咨询预约</h1>
    <p class="sub">选择一位咨询师的可约时段，填写预约事由提交；待对方确认后即预约成功。</p>

    <!-- 可约时段列表 -->
    <h2 class="sec-title">可预约时段</h2>
    <div class="slot-list" id="slotList">
      <p class="empty-tip" id="slotEmpty" hidden>暂时没有可预约的时段，请稍后再来。</p>
    </div>

    <!-- 我的预约列表 -->
    <h2 class="sec-title">我的预约</h2>
    <div class="appt-list" id="apptList">
      <p class="empty-tip" id="apptEmpty" hidden>你还没有预约记录。</p>
    </div>
  </div>

  <div class="modal-mask" id="bookMask" hidden>
    <div class="modal">
      <h3>预约心理咨询</h3>
      <p class="modal-slot" id="bookSlot"></p>
      <label>预约事由（选填）</label>
      <textarea id="bookReason" placeholder="简单说说你想聊些什么…"></textarea>
      <div class="modal-ops">
        <button class="btn-cancel" id="bookCancel">取消</button>
        <button class="btn-ok" id="bookConfirm">确认提交</button>
      </div>
      <p class="modal-msg" id="bookMsg" hidden></p>
    </div>
  </div>

  <!-- 预约详情弹窗：查看教师审批结果 / 驳回备注 -->
  <div class="modal-mask" id="detailMask" hidden>
    <div class="modal">
      <h3>预约详情</h3>
      <div id="detailBody"></div>
      <div class="modal-ops">
        <button class="btn-ok" id="detailClose">关闭</button>
      </div>
    </div>
  </div>

  <script src="/static/js/auth.js"></script>
  <script src="/static/js/appointment.js"></script>
</body>
</html>
