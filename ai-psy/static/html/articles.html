<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>心理科普文章 · 心晴</title>
  <link rel="stylesheet" href="/static/css/common.css">
  <link rel="stylesheet" href="/static/css/articles.css">
</head>
<body>
  <div class="page">
    <!-- 列表视图 -->
    <div id="listView">
      <div class="head-nav">
        <a class="back" href="/" onclick="if(history.length&gt;1){history.back();return false;}return true;">← 返回上一页</a>
        <a class="back-link" href="/">返回首页</a>
      </div>
      <h1>📖 心理科普文章</h1>
      <p class="sub">科学 · 正向 · 治愈 · 落地，陪你在成长路上照顾好自己</p>

      <div id="articleList" class="article-list">
        <div class="loading" id="listLoading">加载中…</div>
      </div>

      <!-- 分页控件（有更多页时显示） -->
      <div class="pager" id="pager" hidden>
        <button class="page-btn" id="prevPage" hidden>上一页</button>
        <span class="page-info" id="pageInfo"></span>
        <button class="page-btn" id="nextPage">下一页</button>
      </div>
    </div>

    <!-- 详情视图 -->
    <div id="detailView" hidden>
      <button class="back" id="backBtn">← 返回列表</button>
      <div id="detailBody" class="detail-body"></div>
    </div>
  </div>

  <!-- 悬浮「回到顶部」按钮 -->
  <button class="back-top" id="backTopBtn" type="button" aria-label="回到顶部">
    <span class="bt-arrow">▲</span>
    <span class="bt-tip">回到顶部</span>
  </button>

  <script src="/static/js/auth.js"></script>
  <script src="/static/js/articles.js"></script>
</body>
</html>
