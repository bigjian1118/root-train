<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>人脸视频分析 · 心晴</title>
  <link rel="stylesheet" href="/static/css/common.css">
  <link rel="stylesheet" href="/static/css/face.css">
</head>
<body>
  <div class="page">
    <header class="head">
      <div class="head-nav">
        <a class="back" href="/" onclick="if(history.length&gt;1){history.back();return false;}return true;">← 返回上一页</a>
        <a class="back-link" href="/">返回首页</a>
      </div>
      <h1>📷 面部情绪视频分析</h1>
      <p class="sub">录制正对摄像头的自然表情视频，AI 解析你的面部情绪状态</p>
    </header>

    <main class="stage">
      <!-- 左侧：窄栏状态栏（磨砂玻璃卡片） -->
      <aside class="side-panel glass">
        <div class="opt-group">
          <label class="opt-label">录制类型</label>
          <select id="recType">
            <option value="auto" selected>自动</option>
            <option value="manual">手动</option>
          </select>
        </div>
        <div class="opt-group">
          <label class="opt-label">录制时长</label>
          <select id="recDuration">
            <option value="5">5 秒</option>
            <option value="10" selected>10 秒</option>
            <option value="15">15 秒</option>
            <option value="20">20 秒</option>
            <option value="30">30 秒</option>
          </select>
        </div>
        <div class="opt-group">
          <label class="opt-label">拍摄模式</label>
          <select id="shotMode">
            <option value="single" selected>单次拍摄</option>
            <option value="multi">多次拍摄</option>
          </select>
        </div>
        <div class="opt-group">
          <label class="opt-label">摄像头选择</label>
          <select id="cameraSelect">
            <option value="">本机摄像头（默认）</option>
          </select>
        </div>
        <div class="opt-group">
          <label class="opt-label">光线模式</label>
          <select id="lightMode">
            <option value="natural" selected>自然光</option>
            <option value="indoor">室内灯</option>
            <option value="dim">暗光</option>
          </select>
        </div>

        <hr class="grad-divider">

        <button class="btn btn-open" id="openBtn">1️⃣ 开启摄像头</button>
        <button class="btn btn-rec" id="recBtn" disabled>2️⃣ 开始录制</button>
        <p class="side-tip" id="sideTip">提示：需在 https 或 localhost 环境下授权摄像头；AutoDL 用户建议 SSH 端口转发后本地访问。</p>
      </aside>

      <!-- 右侧：宽幅拍摄主区域 -->
      <section class="capture-col">
        <div class="capture glass" id="recordPanel">
          <div class="capture-top">
            <span class="rec-lamp" id="recDot" hidden><i></i>REC</span>
            <span class="countdown" id="countdown" hidden>00:00:00</span>
            <span class="seg-count" id="segCount" hidden></span>
          </div>
          <div class="video-box">
            <video id="preview" autoplay playsinline muted></video>
            <div class="video-placeholder" id="videoPlaceholder">
              <img class="placeholder-img" src="/static/picture/face.png" alt="摄像头未开启">
            </div>
          </div>
          <div class="multi-ops" id="multiOps" hidden>
            <button class="btn btn-open" id="againBtn">再录一段</button>
            <button class="btn btn-submit" id="submitBtn">提交分析</button>
          </div>
        </div>

        <!-- 分析等待区 -->
        <section class="loading-panel glass" id="loadingPanel" hidden>
          <div class="spinner"></div>
          <p>正在用 py-feat 逐帧分析你的面部表情…<br><small>CPU 分析约需 1-3 分钟，请耐心等待</small></p>
        </section>

        <!-- 结果区 -->
        <section class="result-panel glass" id="resultPanel" hidden>
          <h2>分析报告</h2>
          <div class="report-text" id="reportText"></div>

          <h3>主导情绪：<span id="dominantEmotion">-</span></h3>
          <div class="bars">
            <h4>基本情绪概率</h4>
            <div id="emotionBars"></div>
          </div>
          <div class="bars">
            <h4>面部动作单元（AU）强度</h4>
            <div id="auBars"></div>
          </div>

          <div class="chart-panel curve-panel">
            <span class="legend"><span><i class="lg-green"></i>情绪分布</span><span><i class="lg-blue"></i>常模参考线</span></span>
            <h4>心态分布曲线</h4>
            <div id="emotionCurve"></div>
          </div>

          <div class="index-cards" id="indexCards">
            <!-- 启发式分级指标卡（前端估算） -->
          </div>
          <p class="est-tip">以上分级指标由表情概率与面部活跃度启发式估算，仅供参考，不构成医学诊断。</p>

          <div class="meta-line" id="metaLine"></div>

          <button class="btn btn-open" id="retryBtn">重新录制</button>
        </section>
      </section>
    </main>
  </div>

  <div class="toast" id="toast" hidden></div>
  <script src="/static/js/auth.js"></script>
  <script src="/static/js/md_render.js"></script>
  <script src="/static/js/face.js"></script>
</body>
</html>
